name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-core.txt
      - name: Install test dependencies
        run: pip install -r requirements-core.txt pytest
      - name: Compile Python
        run: python -m compileall -q app
      - name: Run tests
        env:
          PYTHONUTF8: "1"
          MONGODB_URL: mongodb://localhost:27017
          DB_NAME: test
          JWT_SECRET_KEY: ci-test-secret
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-test-password
          CORS_ORIGIN: http://localhost:5173
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  android:
    name: Android tests and release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpeakEasyAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and test
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
